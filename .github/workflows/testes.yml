name: Testes
# Gatilho apenas manual: a matriz hospedada está desativada (billing da conta
# do GitHub bloqueia jobs automáticos). Validação local: codigo/ferramentas/validar.py
on:
  workflow_dispatch:
    inputs:
      instalador:
        description: 'Gerar o instalador Windows (sem Python embutido) e rodar o selftest empacotado'
        type: boolean
        default: false
jobs:
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Suíte
        run: python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-${{ matrix.os }}-${{ matrix.python }}
          path: resultados-testes.json

  cobertura:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Ferramentas
        run: python -m pip install pytest coverage ruff
      - name: Lint
        run: ruff check codigo conftest.py
      - name: Suíte com cobertura dos subprocessos
        run: python -B -m pytest --cobertura
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: .provas/cobertura/

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: codigo/frontends/electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: codigo/frontends/electron/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalador (sem Python embutido)
        if: inputs.instalador
        env:
          TUCOTECA_SEM_RUNTIME: '1'
        run: npx electron-builder --win --config electron-builder.config.cjs
      - uses: actions/setup-python@v7
        if: inputs.instalador
        with:
          python-version: '3.14'
      - name: Selftest do app empacotado (coleção sintética)
        if: inputs.instalador
        shell: pwsh
        run: |
          python -B ../../ferramentas/semear_prova_electron.py --destino "$env:RUNNER_TEMP\home" --limpar
          $env:BIBLIOTECA_HOME = "$env:RUNNER_TEMP\home"
          $env:TUCOTECA_USERDATA = "$env:RUNNER_TEMP\userdata"
          $env:TUCOTECA_PYTHON = (Get-Command python).Source
          $env:BIBLIOTECA_REDE = '0'
          $p = Start-Process dist\win-unpacked\TucoTeca.exe -ArgumentList '--selftest' -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
