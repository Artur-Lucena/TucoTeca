name: Testes
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: 'Gerar e conferir o payload macOS (usa runner macOS, com custo maior de minutos)'
        type: boolean
        default: false
jobs:
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Display virtual Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb openbox
      - name: Suíte Windows
        if: runner.os == 'Windows'
        run: python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
      - name: Suíte Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c '
            openbox >"$RUNNER_TEMP/tucoteca-openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
          '
      - name: Launchers e instalador Linux em sandbox
        if: runner.os == 'Linux'
        run: python -B codigo/ferramentas/provar_linux_shell.py
      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-${{ matrix.os }}-${{ matrix.python }}
          path: resultados-testes.json
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QML_DISABLE_DISK_CACHE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Bibliotecas Qt Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Dependências desktop
        run: python -m pip install -r requirements-ui.txt pytest coverage ruff
      - name: Lint crítico
        run: ruff check codigo conftest.py --select E9,F63,F7,F82
      - name: Suíte completa com Qt Quick e cobertura dos subprocessos
        run: python -B -m pytest --cobertura
      - name: Relatório Qt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-${{ matrix.os }}
          path: .provas/cobertura/

  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Montar payload macOS
        run: python3 -B codigo/ferramentas/montar_mac.py
      - name: Conferir payload, instalador e privacidade
        run: |
          set -eu
          payload=$(ls dist/mac/tucoteca-mac-*.tar.xz)
          sh -n dist/mac/Instalar-Mac.command
          tar -tJf "$payload" > "$RUNNER_TEMP/payload.txt"
          grep -qx 'tucoteca/BibliotecaHubMac.command' "$RUNNER_TEMP/payload.txt"
          grep -qx 'tucoteca/app/app_win.py' "$RUNNER_TEMP/payload.txt"
          grep -qx 'tucoteca/app/navegacao_controle.py' "$RUNNER_TEMP/payload.txt"
          grep -qx 'tucoteca/app/qt_emulacao.py' "$RUNNER_TEMP/payload.txt"
          if grep -E '^tucoteca/dados/.+[^/]$' "$RUNNER_TEMP/payload.txt"; then
            echo "dado pessoal no payload" >&2
            exit 1
          fi
          if grep -E '/(saves|sysdata|aes_keys\.txt|\.db)$' "$RUNNER_TEMP/payload.txt"; then
            echo "estado de emulador no payload" >&2
            exit 1
          fi
          wc -c "$payload"
