name: Testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Display virtual Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: Suíte Windows
        if: runner.os == 'Windows'
        run: python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
      - name: Suíte Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.os }}-${{ matrix.python }}
          path: resultados-testes.json
