name: Testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Display virtual Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb openbox
      - name: Suíte Windows
        if: runner.os == 'Windows'
        run: python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
      - name: Suíte Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c '
            openbox >"$RUNNER_TEMP/tucoteca-openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            python -B codigo/ferramentas/testes/executar.py --json resultados-testes.json
          '
      - name: Launchers e instalador Linux em sandbox
        if: runner.os == 'Linux'
        run: python -B codigo/ferramentas/provar_linux_shell.py
      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.os }}-${{ matrix.python }}
          path: resultados-testes.json
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QML_DISABLE_DISK_CACHE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bibliotecas Qt Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Dependências desktop
        run: python -m pip install -r requirements-ui.txt pytest coverage ruff
      - name: Lint crítico
        run: ruff check codigo conftest.py --select E9,F63,F7,F82
      - name: Suíte completa com Qt Quick e cobertura dos subprocessos
        run: python -B -m pytest --cobertura
      - name: Relatório Qt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ matrix.os }}
          path: .provas/cobertura/

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
