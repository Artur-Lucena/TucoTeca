[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tucoteca"
version = "1.0.1"
description = "Hub local-first de jogos, musicas e videos (nucleo Python stdlib + desktop PySide6/Qt Quick)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tuco" }]
keywords = ["games", "library", "launcher", "pyside6", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
# Nucleo = somente biblioteca padrao. PySide6 e dependencia da interface.
dependencies = []

[project.optional-dependencies]
ui = ["PySide6-Essentials==6.10.2"]
extras = ["PySide6-Addons==6.10.2"]  # variante completa: WebEngine/Multimedia; sem gamepad
dev = ["pytest>=8", "coverage>=7", "ruff>=0.6"]

[project.scripts]
tucoteca = "frontends.desktop:main"

[tool.setuptools]
package-dir = { "" = "codigo" }

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.pytest.ini_options]
testpaths = ["codigo/ferramentas/testes"]
python_functions = ["teste_*"]
addopts = "-q"
cache_dir = ".provas/pytest-cache"

[tool.coverage.run]
source = ["codigo/bib_nucleo", "codigo/frontends"]
omit = ["codigo/ferramentas/testes/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = ".provas/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Excecoes declaradas (nada foi silenciado sem justificativa registrada):
#
# E501 - linhas longas sao preferidas a quebrar contrato/mensagem de erro.
# E402 - imports no meio do arquivo quebram ciclos de importacao de proposito
#        (banco<->banco_desejos, scans<->scans_hydra,
#        emuladores<->sessoes_manuais, musicas<->rede.metadados,
#        baixar<->rede.binarios) ou antecedem o ajuste de sys.path nos
#        builders. Mover para o topo quebraria o carregamento do nucleo;
#        a convencao esta documentada em CONTRIBUTING.md e ARQUITETURA.md.
# F403 - bib_core.py e a fachada de compatibilidade: reexporta a API publica
#        via `__all__` de cada modulo justamente para preservar consumidores
#        antigos. Trocar por 22 imports nomeados anularia esse proposito.
ignore = ["E501", "E402", "F403"]

[tool.ruff.lint.per-file-ignores]
# F401 nesses arquivos e a prova de disponibilidade do modulo
# (`try: import tkinter` -> skip), nao codigo morto.
"codigo/ferramentas/testes/test_dialogo.py" = ["F401"]
"codigo/ferramentas/testes/test_varredura.py" = ["F401"]
