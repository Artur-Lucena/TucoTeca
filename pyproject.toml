[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tucoteca"
version = "1.4.6"
description = "Hub local-first de jogos, musicas e videos (nucleo Python stdlib + desktop Electron)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tuco" }]
keywords = ["games", "library", "launcher", "electron", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
# Nucleo = somente biblioteca padrao. A interface desktop e o app Electron
# (codigo/frontends/electron, dependencias npm); a TUI usa curses.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
package-dir = { "" = "codigo" }

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.pytest.ini_options]
testpaths = ["codigo/ferramentas/testes"]
python_functions = ["teste_*"]
addopts = "-q"
cache_dir = ".provas/pytest-cache"

[tool.coverage.run]
source = ["codigo/bib_nucleo", "codigo/frontends"]
omit = ["codigo/ferramentas/testes/*"]

[tool.mypy]
# Checagem de tipos gradual: hoje cobre os builders (ferramentas/).
# follow_imports=silent mantem o escopo nos arquivos pedidos, sem despejar
# os achados legados do nucleo; ampliar o escopo e incremental.
python_version = "3.10"
files = ["codigo/ferramentas"]
exclude = ["codigo/ferramentas/testes"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = ".provas/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Excecoes declaradas (nada foi silenciado sem justificativa registrada):
#
# E501 - linhas longas sao preferidas a quebrar contrato/mensagem de erro.
# E402 - imports no meio do arquivo quebram ciclos de importacao de proposito
#        (banco<->banco_desejos, scans<->scans_hydra,
#        emuladores<->sessoes_manuais, musicas<->rede.metadados,
#        baixar<->rede.binarios) ou antecedem o ajuste de sys.path nos
#        builders. Mover para o topo quebraria o carregamento do nucleo;
#        a convencao esta documentada em docs/CONTRIBUTING.md e docs/ARQUITETURA.md.
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# F401 na fachada do pacote: os reexports (inclusive `_privados` e os
# modulos `os`/`shutil`/`subprocess`, alvos de monkeypatch nos testes)
# SAO o contrato de compatibilidade com o antigo `emuladores.py`; a
# cobertura nominal e provada pelo teste de completude da fatia F1.
# F403: essas fachadas reexportam via `import *` + `__all__`.
"codigo/bib_nucleo/emuladores/__init__.py" = ["F401", "F403", "F405"]
# Idem p/ a fachada do pacote de scans (F2 do O2).
"codigo/bib_nucleo/scans/__init__.py" = ["F401", "F403", "F405"]
